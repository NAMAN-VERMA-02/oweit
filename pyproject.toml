[project]
name = "oweit"
version = "0.1.0"
description = "Finds the promises you made in WhatsApp chats and email, and reminds you gently: one digest a day, never while you're busy."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Naman Verma" }]
dependencies = [
    "anthropic>=2.6.0",
    "dateparser>=1.5.0",
    "icalendar>=7.3.0",
    "recurring-ical-events>=3.8.2",
]

[project.scripts]
oweit = "oweit.cli:main"

[project.gui-scripts]
# windowless entry point so the scheduled task doesn't flash a console every 30 minutes
oweitw = "oweit.cli:main"

[dependency-groups]
demo = [
    "pillow>=13.0.0",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
